services:
  mysql-db:
    image: mysql:8.0
    container_name: driveshare-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: driveshare_db

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    
    container_name: driveshare_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql-db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: driveshare_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend
    
volumes:
  db_data: